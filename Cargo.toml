[package]
name = "auto-clicker"
version = "0.1.0"
edition = "2024"
description = "A precision desktop auto clicker with configurable timing and macro sequences"

[dependencies]
eframe = "0.33.3"
egui = "0.33.3"
enigo = "0.6.1"
global-hotkey = "0.9.0"
serde = { version = "1", features = ["derive"] }
ron = "0.8.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1"
